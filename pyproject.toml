[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.141.1"
uvicorn = {extras = ["standard"], version = "^0.52.0"}
pydantic = {extras = ["email"], version = "^2.13.4"}
pydantic-settings = "^2.14.2"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.51"}
asyncpg = "^0.31.0"
alembic = "^1.19.0"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)"
]
